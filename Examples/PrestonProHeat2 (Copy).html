<!DOCTYPE html>
<html>
<head>
  <title>The Preston Heat Map (Centered)</title>
  <meta charset="utf-8" />
  <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
  <script>
    // 1. Initialize MapLibre map (no fixed center)
    var map = new maplibregl.Map({
      container: 'map',
      style: {
        "version": 8,
        "sources": {
          "osm-tiles": {
            "type": "raster",
            "tiles": [
              "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
              "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
              "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
            ],
            "tileSize": 256,
            "attribution": "© OpenStreetMap contributors"
          }
        },
        "layers": [
          {
            "id": "osm-tiles",
            "type": "raster",
            "source": "osm-tiles",
            "minzoom": 0,
            "maxzoom": 19
          }
        ]
      },
      zoom: 17,
      bearing: -90 // flipped counter-clockwise
    });

    // 2. Add navigation controls (includes compass rotation)
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    // -----------------------------
    // 3. Property coordinates + activity levels
    // -----------------------------
    const propertyCoordinates = {
      b1:  { name: "Building 1", lat: 33.4348006, lng: -84.1773155 },
      b7:  { name: "Building 7", lat: 33.4375918, lng: -84.1767307 },
      b15: { name: "Building 15", lat: 33.4390623, lng: -84.1765832 },
      a16: { name: "Flood", lat: 33.4372292, lng: -84.1771089 },
      a17: { name: "Incident", lat: 33.4335270, lng: -84.1778465 },
      a19: { name: "Trash Front", lat: 33.4330614, lng: -84.1776427 },
      a20: { name: "Trash Section 1", lat: 33.4342791, lng: -84.1778331 },
      a21: { name: "Trash Section 2", lat: 33.4346417, lng: -84.1778868 },
      a22: { name: "Trash Section 3", lat: 33.4349752, lng: -84.1768622 },
      a23: { name: "Trash Section 4", lat: 33.4371419, lng: -84.1772645 },
      a24: { name: "Trash Section 5", lat: 33.4381581, lng: -84.1761353 }
    };

    const activityLevels = {
      a19: 8, a20: 6, a21: 7, a22: 5, a23: 9, a24: 10,
      a16: 7, a17: 9,
      b1: 4, b7: 3, b15: 5
    };

    // 4. Convert to GeoJSON FeatureCollection
    const features = Object.entries(propertyCoordinates).map(([id, loc]) => ({
      type: "Feature",
      properties: { intensity: activityLevels[id] || 0 },
      geometry: {
        type: "Point",
        coordinates: [loc.lng, loc.lat]
      }
    }));

    const geojson = {
      type: "FeatureCollection",
      features: features
    };

    // 5. Add heatmap source + layer once map is ready
    map.on('load', () => {
      map.addSource('maintenance', {
        type: 'geojson',
        data: geojson
      });

      map.addLayer({
        id: 'maintenance-heat',
        type: 'heatmap',
        source: 'maintenance',
        maxzoom: 19,
        paint: {
          'heatmap-weight': ['get', 'intensity'],
          'heatmap-intensity': 1,
          'heatmap-radius': 30,
          'heatmap-opacity': 0.9,
          'heatmap-color': [
            'interpolate',
            ['linear'],
            ['heatmap-density'],
            0, 'transparent',
            0.2, 'blue',
            0.4, 'lime',
            0.6, 'orange',
            0.8, 'purple',
            1, 'red'
          ]
        }
      });

      // 6. Center map on property bounds
      const bounds = new maplibregl.LngLatBounds();
      geojson.features.forEach(f => bounds.extend(f.geometry.coordinates));
      map.fitBounds(bounds, { padding: 50, bearing: -90 });
    });
  </script>
</body>
</html>
